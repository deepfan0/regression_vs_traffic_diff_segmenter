[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfan0-regression_vs_traffic_diff_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对标注平台与数据质量工程师·回归集与线上样本的差分相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "deepfan0" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://deepfan0.github.io"
Repository = "https://github.com/deepfan0/regression_vs_traffic_diff_segmenter"
Issues = "https://github.com/deepfan0/regression_vs_traffic_diff_segmenter/issues"

[project.scripts]
regression_vs_traffic_diff_segmenter = "regression_vs_traffic_diff_segmenter:main"

[tool.setuptools]
py-modules = ["regression_vs_traffic_diff_segmenter"]
